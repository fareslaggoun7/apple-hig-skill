<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title"><title id="title">Illustrative review: clarify actions, give an exit alternative, and provide status feedback</title><rect width="100%" height="100%" fill="#f5f8fc"/>
<text x="38" y="59.599999999999994" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="650" fill="#152b46">A review connects an observation to a correction.</text>
<text x="40" y="95.94" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#53677f">Original educational mockup — not an Apple screenshot or exact geometry specification.</text>
<text x="40" y="160.86" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" fill="#152b46">Before / restricted exit</text>
