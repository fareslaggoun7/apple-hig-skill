name: Validate portable skill
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python skills/apple-hig/scripts/hig.py audit
      - run: python tools/build_gallery_catalog.py --check
      - run: node --test tests/gallery.test.mjs
      - run: python tools/package.py --check
      - run: python tools/package_gallery.py --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix work/browser-tools --no-audit --no-fund --ignore-scripts playwright@1.56.1
      - run: node work/browser-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify every route and representative interactions
        env:
          NODE_PATH: ${{ github.workspace }}/work/browser-tools/node_modules
        run: |
          python -m http.server 8000 --directory examples/gallery --bind 127.0.0.1 > /tmp/gallery.log 2>&1 &
          GALLERY_SERVER_PID=$!
          trap 'kill "$GALLERY_SERVER_PID"' EXIT
          set +e
          node tools/check_gallery_browser.mjs > /tmp/browser-check.log 2>&1
          BROWSER_CHECK_STATUS=$?
          cat /tmp/browser-check.log
          if [ "$BROWSER_CHECK_STATUS" -ne 0 ]; then cat /tmp/gallery.log; fi
          {
            printf '### Browser verification\n\n```text\n'
            tail -n 160 /tmp/browser-check.log
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$BROWSER_CHECK_STATUS"
