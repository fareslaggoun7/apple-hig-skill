name: Remove temporary browser diagnostic reports
on:
  push:
    branches: ['codex/visual-gallery']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the reports created during this continuation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          repo=os.environ['GH_REPO']
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/v1.1.1']))
          assert release['tag_name']=='v1.1.1'
          for asset in release['assets']:
              if re.fullmatch(r'(browser-check-[0-9]+-[123]|previous-browser-exception-[0-9]+)\.txt',asset['name']):
                  subprocess.run(['gh','api','--method','DELETE',f"repos/{repo}/releases/assets/{asset['id']}"],check=True)
                  print('Removed temporary report:',asset['name'])
          PYCODE
